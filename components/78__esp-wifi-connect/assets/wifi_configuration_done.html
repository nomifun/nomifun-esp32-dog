<!DOCTYPE html>
<html>
<head>
    <title>WiFi Configuration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            /* Prevent content from overflowing */
            max-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
        }

        .checkmark {
            width: 150px;
            height: 150px;
            margin-bottom: 30px;
        }

        .message {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="checkmark" viewBox="0 0 52 52">
            <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" stroke="#4CAF50" stroke-width="2"/>
            <path class="checkmark__check" fill="none" stroke="#4CAF50" stroke-width="2" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
        
        <div class="message">
            <p>配置已保存，机器人正在重启并连接 Wi-Fi。</p>
            <p>如果约 60 秒后热点再次出现，请重新连接并检查 Wi-Fi 名称和密码。</p>
            <p>Configuration saved. The robot is restarting to connect to Wi-Fi.</p>
            <p>If the hotspot returns after about 60 seconds, reconnect and check the Wi-Fi name and password.</p>
        </div>
    </div>
    
    <!-- Informational only. The submit handler schedules restart itself,
         even when the phone loses its connection before loading this page. -->
</body>
</html>
